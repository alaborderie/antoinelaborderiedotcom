<!doctype html>
<html lang="{{ lang }}" class="spatial-no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="{{ canonical }}" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://antoinelaborderie.com/concept-spatial"
    />
    <link
      rel="alternate"
      hreflang="fr"
      href="https://antoinelaborderie.com/concept-spatial/fr"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://antoinelaborderie.com/concept-spatial"
    />
    <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/concept-spatial.css" />
    <script>
      document.documentElement.className = "spatial-js";
    </script>
    <script defer src="/static/concept-spatial.js"></script>
  </head>
  <body id="spatial-top">
    {% if is_french %}{% include "content/concept-spatial-fr.html" %}{% else
    %}{% include "content/concept-spatial-en.html" %}{% endif %}
  </body>
</html>
